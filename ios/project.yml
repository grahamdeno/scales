# Scales for iPhone: the Scales web app in a native shell that adds reminders
# scheduled on the phone and the Home Screen badge. Built in the cloud by
# .github/workflows/ios.yml; no Mac needed.
name: Scales
options:
  bundleIdPrefix: com.grahamdeno
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 7MHDTK68M2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Scales:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Scales
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # The daily save shows in Files, On My iPhone, Scales (1.77.0).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        CFBundleURLTypes:
          - CFBundleURLName: com.grahamdeno.scales
            CFBundleURLSchemes: [scales]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.scales
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Scales:
    build:
      targets:
        Scales: all
    archive:
      config: Release
