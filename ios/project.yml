# Scales for iPhone: the Scales web app, bundled inside (build 40), in a native shell that adds haptics, the daily backup file, the app icon and
# Apple Intelligence. Built in the cloud by
# .github/workflows/ios.yml; no Mac needed.
name: Scales
options:
  bundleIdPrefix: com.grahamdeno
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 7MHDTK68M2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Scales:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["PrivacyInfo.xcprivacy", "NativeStore.js"]
      # Build 39: the privacy manifest (UserDefaults only, no tracking, no collected data), always in the Resources phase.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Build 40: the script that keeps the page's saves in step with the app's own file (NativeStore.swift).
      - path: App/NativeStore.js
        buildPhase: resources
      # Build 40: the web app itself, copied in by scripts/bundle-web.sh before the project is made, as one folder.
      - path: web
        type: folder
        buildPhase: resources
      # 2.38.0 (1.2): the file shared with the Share Sheet extension (see ios/Share/InboxFile.swift); built into both targets.
      - path: Share/InboxFile.swift
    dependencies:
      # 2.38.0 (1.2): the Share Sheet extension is built with the app and embedded in it (PlugIns/ScalesShare.appex).
      - target: ScalesShare
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Scales
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # iPhone only (2.2.0): the App Store asks for iPad screenshots of any build that lists iPad (1 is iPhone, 2 is iPad).
        UIDeviceFamily: [1]
        # The daily save shows in Files, On My iPhone, Scales (1.77.0).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # And in iCloud Drive, Scales, when iCloud is on (1.77.1).
        NSUbiquitousContainers:
          iCloud.com.grahamdeno.scales:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Scales
            NSUbiquitousContainerSupportedFolderLevels: None
        # 2.37.0 (1.1): the status bar is set per screen by the web view's controller (light on plum, dark on pistachio).
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        # 2.37.0: one window scene, made by SceneDelegate in ScalesApp.swift (the app moved from SwiftUI's WindowGroup).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/Scales.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.grahamdeno.scales]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.grahamdeno.scales]
        # 2.38.0 (1.2): the App Group the app shares with its Share Sheet extension (registered 23 November 2026). The full
        # string is written here; Apple adds the "group." prefix itself only in the portal.
        com.apple.security.application-groups: [group.com.grahamdeno.scales]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.scales
        # iPhone only: XcodeGen's iOS preset says "1,2" (iPhone and iPad) for an app target, and a target setting beats the
        # project-level one, so it is set here. (A second `settings:` key on this target is silently ignored, so keep one.)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Pistachio, Plum and Bone, chosen in Settings; the main icon (Automatic) follows the Home Screen (2.2.0).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Pistachio AppIcon-Plum AppIcon-Bone
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # 2.38.0 (1.2): the Share Sheet extension. Select text in any app, Share, Scales: Keep leaves an entry in the App Group
  # inbox, and the app adds it as a thought the next time it opens. Plain text and one web link; nothing leaves the phone.
  ScalesShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
        excludes: ["PrivacyInfo.xcprivacy"]
      - path: Share/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Scales
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Share/ScalesShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.grahamdeno.scales]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.scales.share
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
schemes:
  Scales:
    build:
      targets:
        Scales: all
    # 2.36.0: Scales Full is tried in the simulator and from Xcode against this file (no App Store needed).
    run:
      storeKitConfiguration: Scales.storekit
    archive:
      config: Release
