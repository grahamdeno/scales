# Scales for iPhone: the Scales web app in a native shell that adds reminders
# scheduled on the phone and the Home Screen badge. Built in the cloud by
# .github/workflows/ios.yml; no Mac needed.
name: Scales
options:
  bundleIdPrefix: com.grahamdeno
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 7MHDTK68M2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Scales:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Scales
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # iPhone only (2.2.0): the App Store asks for iPad screenshots of any build that lists iPad (1 is iPhone, 2 is iPad).
        UIDeviceFamily: [1]
        # The daily save shows in Files, On My iPhone, Scales (1.77.0).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # And in iCloud Drive, Scales, when iCloud is on (1.77.1).
        NSUbiquitousContainers:
          iCloud.com.grahamdeno.scales:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Scales
            NSUbiquitousContainerSupportedFolderLevels: None
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        # Off since 2.2.0: Scales 2 has no AI and Plus is not offered. (It let TestFlight copies try Scales Plus, 1.82.0.)
        ScalesPlusPreview: false
        CFBundleURLTypes:
          - CFBundleURLName: com.grahamdeno.scales
            CFBundleURLSchemes: [scales]
    entitlements:
      path: App/Scales.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.grahamdeno.scales]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.grahamdeno.scales]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.scales
        # iPhone only: XcodeGen's iOS preset says "1,2" (iPhone and iPad) for an app target, and a target setting beats the
        # project-level one, so it is set here. (A second `settings:` key on this target is silently ignored, so keep one.)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Pistachio, Plum and Bone, chosen in Settings; the main icon (Automatic) follows the Home Screen (2.2.0).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Pistachio AppIcon-Plum AppIcon-Bone
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Scales:
    build:
      targets:
        Scales: all
    archive:
      config: Release
