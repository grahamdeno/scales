# First run, part 3 of 3: close the app completely and open it again; the kept thought must still be there.
appId: com.grahamdeno.scales
name: First run, part 3, restart
---
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- takeScreenshot: 01-after-restart
- assertNotVisible:
    text: "What's on your mind?"
- extendedWaitUntil:
    visible: "(.*)Patience(.*)"
    timeout: 20000
