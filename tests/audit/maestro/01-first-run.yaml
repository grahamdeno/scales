# First run on a clean install: the first screen says what to do, a thought is kept, and it survives a restart.
# Text is matched as a pattern: iOS reads web text as whole phrases ("Kept. It comes back tomorrow."), not single words.
# One plain word is typed: typing into a web view can drop letters, and a lost letter is not what this flow tests.
appId: com.grahamdeno.scales
name: First run, keep a thought, restart
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "What's on your mind?"
    timeout: 20000
- takeScreenshot: 01-first-screen
# On a first run "What's on your mind?" is the heading above the field; since 2.33.1 tapping it puts the cursor in the field.
- tapOn: "What's on your mind\\?"
- inputText: "Patience"
- takeScreenshot: 01-keyboard-up
- tapOn: "Keep"
- takeScreenshot: 01-after-keep
# Probes (never fail the flow): the per-step log shows which screen Keep led to.
- assertVisible:
    text: "Kept\\..*"
    optional: true
- assertVisible:
    text: "What's on your mind\\?"
    optional: true
# "Kept." shows for 1.6 s, too short to rely on; the check is that the thought then stands on the reading screen.
- extendedWaitUntil:
    visible: ".*Patience.*"
    timeout: 8000
    label: "The kept thought is on the reading screen"
- takeScreenshot: 01-kept
# Close the app completely and open it again: the thought must still be there (NativeStore keeps a file copy).
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- takeScreenshot: 01-after-restart
- assertNotVisible:
    text: "What's on your mind?"
    label: "After a restart the app is not empty again"
- extendedWaitUntil:
    visible: "(.*)Patience(.*)"
    timeout: 20000
    label: "After a restart the thought is still there"
