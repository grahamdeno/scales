name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test

  # Scales in a real browser at 390, 375 and 430 wide (2.0.0): tests/e2e/app.e2e.js.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          set +e
          node tests/e2e/app.e2e.js > e2e.log 2>&1
          code=$?
          # Surface failures as annotations, so they can be read without the full log.
          grep -E -A3 "^FAIL|Error:" e2e.log | grep -v "^--$" | head -60 | sed 's/^/::error::/'
          tail -n 5 e2e.log
          exit $code

  # After tests pass on main, tag the commit with the version in core.js
  # (for example v1.21.0) unless that version is already tagged.
  tag:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the release
        run: |
          v="v$(node -p "require('./core.js').VERSION")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
            echo "$v is already tagged"
          else
            git tag "$v" "$GITHUB_SHA"
            git push origin "$v"
            echo "Tagged $v"
          fi
