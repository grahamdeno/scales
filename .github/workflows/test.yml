name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test

  # The main loop in a real browser at iPhone size (1.68.0): tests/e2e/loop.e2e.js.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/e2e/loop.e2e.js

  # After tests pass on main, tag the commit with the version in core.js
  # (for example v1.21.0) unless that version is already tagged.
  tag:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release
        run: |
          v="v$(node -p "require('./core.js').VERSION")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
            echo "$v is already tagged"
          else
            git tag "$v" "$GITHUB_SHA"
            git push origin "$v"
            echo "Tagged $v"
          fi
