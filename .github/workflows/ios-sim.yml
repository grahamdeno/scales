name: iPhone Simulator audit

# The bundled iPhone app on a real iOS Simulator, driven by Maestro flows (tests/audit/maestro/). Checks what the
# browser walk cannot: the WKWebView shell, the scales-app:// bundle, safe areas and the Home indicator, the real
# keyboard, and that a thought survives the app being closed and opened again (NativeStore).
# Started by hand only (macOS minutes cost ten times Linux ones). Screenshots and results: artifact "ios-sim-audit".
# A run GitHub cancels for want of a Mac ("not acquired") can simply be re-run.

on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Pick Xcode
        run: |
          X="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$X"
          xcodebuild -version | head -1 | sed 's/^/::notice::Using /'
      - name: Bundle the web app
        run: scripts/bundle-web.sh ios/web
      - name: Make the Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          # The newest iPhone simulator on this Mac (not a Pro Max, not an SE), booted.
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
            if "iOS" not in rt: continue
            v=tuple(int(x) for x in re.findall(r"(\d+)",rt.split("iOS")[-1])[:2])
            for x in devs:
              n=x["name"]
              if n.startswith("iPhone") and "Max" not in n and "SE" not in n and "e" != n.split()[-1]:
                k=(v,n)
                if best is None or k>best[0]: best=(k,x["udid"],n)
          print(best[1]); print(best[2],file=sys.stderr)')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Build for the simulator
        run: |
          cd ios
          xcodebuild -project Scales.xcodeproj -scheme Scales -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -60 build.log; exit 1; }
          APP="$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
      - name: Install Maestro
        run: |
          # The installer's own download sometimes gets a 503 and leaves a corrupt zip. Fetch the release directly,
          # retry, and check the zip before using it. Stop here, with a clear line, if it never works.
          ok=0
          for i in 1 2 3 4 5 6; do
            rm -f /tmp/maestro.zip
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 10 -o /tmp/maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/latest/download/maestro.zip" && unzip -tq /tmp/maestro.zip >/dev/null; then ok=1; break; fi
            echo "Maestro download try $i failed"; sleep 30
          done
          test "$ok" = 1 || { echo "::error::Maestro could not be downloaded after 6 tries"; exit 1; }
          mkdir -p "$HOME/.maestro" && unzip -qo /tmp/maestro.zip -d "$HOME/.maestro"
          M="$(find "$HOME/.maestro" -type f -name maestro -path '*/bin/*' | head -1)"
          test -n "$M" || { echo "::error::no maestro binary in the download"; exit 1; }
          chmod +x "$M"; dirname "$M" >> "$GITHUB_PATH"
      - name: Walk the flows
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
        run: |
          # pipefail: without it the tee hides a failed flow and the run shows green.
          set -o pipefail
          mkdir -p ios-audit
          cd ios-audit
          maestro --device "${{ steps.sim.outputs.udid }}" test ../tests/audit/maestro --format junit --output results.xml --test-output-dir . 2>&1 | tee maestro.log
      - name: What the screen held when a flow failed
        if: failure()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          python3 tests/audit/screen.py "$UDID" "last screen" || true
          echo "== the app's save file"
          C="$(xcrun simctl get_app_container "$UDID" com.grahamdeno.scales data)"
          python3 - "$C/Library/Application Support/Scales/store.json" <<'PY' || true
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception as e: print("no readable save file:",e); sys.exit(0)
          print("rev",d.get("rev"))
          for k,v in d.get("data",{}).items(): print("key",k,len(v),"chars")
          PY
          echo "== the app's own log lines (Debug build)"
          xcrun simctl spawn "$UDID" log show --last 30m --style compact --predicate 'eventMessage CONTAINS "SCALESSTORE"' | grep SCALESSTORE | sed 's/^.*SCALESSTORE/SCALESSTORE/' | tail -40 || true
          grep -E "\\[(Failed|Passed)\\]" ios-audit/maestro.log | sed 's/^/::warning::/' || true
      - name: Screenshots of the safe areas
        if: always()
        run: xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-audit/last-screen.png || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-sim-audit
          path: ios-audit
          retention-days: 7
