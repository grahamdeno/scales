# Publishes scales.tangomike.app (the Cloudflare Pages project tangomike-scales) whenever the site or the AI
# server changes on main. The project is a Direct Upload, so every deploy is the whole site: the pages in
# site/, the AI server (server/ai.mjs as functions/api/ai.js) and the pass-through that serves the app at
# /app/ (server/app-proxy.js as functions/app/[[path]].js). If any of those, or the Cloudflare secrets, is
# missing, it stops before uploading, so a partial site can never replace the live one.
name: Website
on:
  push:
    branches: [main]
    paths: ["site/**", "server/**", ".github/workflows/site.yml"]
  workflow_dispatch:
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PAGES_BRANCH: ${{ vars.PAGES_BRANCH || 'main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Tests
        run: node --test
      - name: Put the site together
        id: build
        run: |
          missing=""
          for f in site/index.html site/support.html site/privacy.html site/site.css site/_headers site/404.html server/ai.mjs server/app-proxy.js; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then echo "::warning::Not publishing: missing$missing"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Wrangler takes the static files from out/ and the Functions from ./functions next to where it runs.
          rm -rf out functions && mkdir -p out functions/api functions/app
          cp -R site/. out/
          cp server/ai.mjs functions/api/ai.js
          cp server/app-proxy.js "functions/app/[[path]].js"
          find out functions -type f | sort | sed 's/^/  /'
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Publish to Cloudflare Pages
        if: steps.build.outputs.ok == 'true' && env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.0 pages deploy out --project-name=tangomike-scales --branch="$PAGES_BRANCH" --commit-dirty=true
      - name: No Cloudflare key yet
        if: steps.build.outputs.ok == 'true' && env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::Not publishing: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repo's secrets."
      - name: Check the live site
        if: steps.build.outputs.ok == 'true' && env.HAS_TOKEN == 'true'
        run: |
          sleep 20
          fail=0
          check() { body=$(curl -fsSL "https://scales.tangomike.app$1") || { echo "::error::$1 did not load"; fail=1; return; }; echo "$body" | grep -q "$2" && echo "::notice::$1 ok" || { echo "::error::$1 is missing: $2"; fail=1; }; }
          check / "Weigh your thoughts"
          check /support "Support."
          check /privacy "Privacy."
          check /site.css "site.css\|--smoke"
          check /app/ "Scales"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "content-type: application/json" -d '{}' https://scales.tangomike.app/api/ai)
          [ "$code" = "402" ] && echo "::notice::/api/ai asks for Scales Plus (402)" || { echo "::error::/api/ai answered $code, expected 402"; fail=1; }
          exit $fail
