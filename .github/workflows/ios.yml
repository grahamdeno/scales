# Builds Scales for iPhone on a cloud Mac. Every change to ios/ is compiled;
# with the App Store Connect key in the repo's secrets, it's signed and sent
# to TestFlight (install from the TestFlight app on the iPhone).
name: iPhone app
on:
  push:
    branches: [main, ios]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Pick Xcode
        run: |
          echo "::notice::Xcodes on this Mac: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"
          X="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$X"
          xcodebuild -version | head -1 | sed 's/^/::notice::Using /'
      - name: Make the Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Compile (simulator, unsigned)
        run: |
          cd ios
          set +e
          xcodebuild -project Scales.xcodeproj -scheme Scales -sdk iphoneos \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          code=$?
          # Surface our own warnings and errors as annotations, so they can be read without the full log.
          grep -E "ios/(App)/.*(warning|error):" build.log | sed -E 's#^.*/ios/##' | sort -u | head -40 | sed 's/^/::warning::/'
          [ $code -ne 0 ] && tail -n 8 build.log | sed 's/^/::error::/'
          # 1.86.1: say which icons the built app declares and carries, so the icon choice can be checked here.
          if [ $code -eq 0 ]; then
            APP="$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphoneos/Scales.app' -o -path '*Debug-iphoneos/Scales.app' | head -1)"
            echo "::notice::App: $APP"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP/Info.plist" 2>&1 | tr -s ' \n' ' ' | sed 's/^/::notice::CFBundleIcons /'
            ls "$APP" | grep -i -E "icon|\.car" | tr '\n' ' ' | sed 's/^/::notice::Files /'; echo
            xcrun assetutil --info "$APP/Assets.car" 2>/dev/null | grep -E '"Name"' | sort -u | tr -s ' \n' ' ' | sed 's/^/::notice::Assets.car names /'; echo
            grep -E "AppIcon|alternate|\.icon" build.log | grep -i -E "warning|error|note" | sort -u | head -12 | sed 's/^/::warning::actool /'
          fi
          exit $code
      # The Icon Composer icon (1.80.0), rendered the way iOS draws it in each Home Screen style, and pushed to
      # the icon-previews branch so it can be checked before a build goes out. Only on the ios branch.
      - name: Icon previews
        if: github.ref == 'refs/heads/ios'
        run: |
          ICT="$(xcode-select -p)/../Applications/Icon Composer.app/Contents/Executables/ictool"
          [ -x "$ICT" ] || ICT="$(find /Applications -path '*Icon Composer.app/Contents/Executables/ictool' 2>/dev/null | head -1)"
          if [ ! -x "$ICT" ]; then echo "::warning::ictool not found"; exit 0; fi
          "$ICT" --version | sed 's/^/::notice::ictool /' || true
          mkdir -p "$RUNNER_TEMP/prev"
          for i in AppIcon AppIcon-Light AppIcon-Black AppIcon-Paper AppIcon-Glass; do for r in Default Dark TintedLight TintedDark; do
            "$ICT" ios/App/$i.icon --export-image --output-file "$RUNNER_TEMP/prev/$i-$r.png" --platform iOS --rendition $r --width 1024 --height 1024 --scale 1 >/dev/null 2>&1 || echo "::warning::$i $r failed"
          done; done
          ls -la "$RUNNER_TEMP/prev" | sed 's/^/::notice::/'
          cd "$RUNNER_TEMP/prev" && git init -q && git checkout -q -b icon-previews && git add . && git -c user.name=grahamdeno -c user.email=grahamdeno@users.noreply.github.com commit -q -m "Icon previews for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" icon-previews && echo "::notice::Previews pushed to icon-previews"
      - name: Signing key
        if: env.HAS_KEY == 'true' && github.ref == 'refs/heads/main'
        run: |
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" | sed 's/\r$//' > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"
          mkdir -p ~/.appstoreconnect/private_keys && cp "$RUNNER_TEMP/asc.p8" ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archive and send to TestFlight
        if: env.HAS_KEY == 'true' && github.ref == 'refs/heads/main'
        run: |
          cd ios
          set +e
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc.p8 -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}"
          report() { grep -E "error:|Error|failed|No profiles|rovisioning|ertificate|not available|denied" "$1" | sort -u | head -25 | sed 's/^/::error::/'; tail -n 15 "$1"; }
          # Automatic signing needs one registered iPhone for its development profile.
          ASC_KEY_ID=${{ secrets.ASC_KEY_ID }} ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }} ASC_KEY_PATH=$RUNNER_TEMP/asc.p8 ruby register-device.rb || exit 1
          # Archive unsigned, then let the export sign it for the App Store.
          xcodebuild -project Scales.xcodeproj -scheme Scales -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Scales.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO \
            archive > archive.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error::archive failed"; report archive.log; exit $code; fi
          # The archive is unsigned, so it carries no entitlements and the export would drop iCloud (1.77.1).
          # Sign it ad hoc with them; the export then signs it for the App Store and keeps them.
          codesign --force --sign - --entitlements App/Scales.entitlements "$RUNNER_TEMP/Scales.xcarchive/Products/Applications/Scales.app" || { echo "::error::could not add entitlements"; exit 1; }
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Scales.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/out" $AUTH > export.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error::export failed"; report export.log; exit $code; fi
          cd "$RUNNER_TEMP/out"
          # Say whether the signed app carries iCloud (1.77.1), so the daily save can reach iCloud Drive.
          rm -rf chk && mkdir chk && unzip -q *.ipa -d chk
          if codesign -d --entitlements - chk/Payload/*.app 2>/dev/null | grep -q "iCloud.com.grahamdeno.scales"; then echo "::notice::iCloud entitlement is in the signed app"; else echo "::warning::iCloud entitlement is missing from the signed app"; fi
          # iPhone only: if the built app lists iPad (2), the App Store asks for iPad screenshots. Stop before uploading.
          fam=$(/usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" chk/Payload/*.app/Info.plist 2>&1 | tr -d ' \n')
          echo "::notice::UIDeviceFamily in the built app: $fam"
          case "$fam" in *2*) echo "::error::the built app lists iPad (UIDeviceFamily: $fam); it must be iPhone only"; exit 1;; esac
          rm -rf chk
          mkdir -p ~/.appstoreconnect/private_keys && cp "$RUNNER_TEMP/asc.p8" ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-app -f *.ipa -t ios --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }} > upload.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error::upload failed"; report upload.log; exit $code; fi
          echo "::notice::Uploaded build ${{ github.run_number }} to TestFlight"
