# Reads the App Store listing text with the App Store Connect key and prints it (scripts/listing.rb).
# Run by hand with write: true to put appstore/listing.json on the version being prepared. It never submits.
name: App Store listing
on:
  workflow_dispatch:
    inputs:
      write:
        description: "Put appstore/listing.json on the version being prepared (never submits)"
        type: boolean
        default: false
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the listing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          WRITE: ${{ inputs.write && '1' || '0' }}
        run: |
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" | sed 's/\r$//' > "$RUNNER_TEMP/asc.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/asc.p8" ruby scripts/listing.rb
          rm -f "$RUNNER_TEMP/asc.p8"
